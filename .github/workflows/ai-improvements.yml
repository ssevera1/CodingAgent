name: Continuous Improvement

on:
  schedule:
    # One proposal per repo per week, staggered across weekdays so the
    # 11 repos do not all fire in one burst. This spreads the review
    # and fix runs that follow, which are what the API bill is made of.
    #
    # Cron is UTC and does not follow daylight saving, so these land an
    # hour earlier in local time once CDT ends on 2026-11-01.
    - cron: '23 10 * * 2'   # Tue 10:23 UTC (5:23am CDT)
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  improve:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v7
        with:
          token: ${{ secrets.GH_PAT }}
          fetch-depth: 0

      - name: Jitter
        run: sleep $((RANDOM % 900))

      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - run: pip install anthropic --quiet

      - name: Improve
        env:
          # Proposals in a repo tend to target the same hot file, so a deep
          # queue mostly produces PRs that conflict with each other.
          MAX_OPEN_PRS: "3"
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GH_TOKEN: ${{ secrets.GH_PAT }}
          GIT_AUTHOR_NAME: Scott Severance
          GIT_AUTHOR_EMAIL: scott@scottseverance.net
          GIT_COMMITTER_NAME: Scott Severance
          GIT_COMMITTER_EMAIL: scott@scottseverance.net
        run: python scripts/ai_improve.py
