name: Continuous Improvement

on:
  schedule:
    # One proposal per repo per week, staggered across weekdays and placed
    # in the small hours so a run never lands mid-workday.
    #
    # Cron is UTC and ignores daylight saving. Times sit at or after 01:00
    # CDT on purpose: under CST they shift an hour earlier, and anything
    # before 01:00 would cross back over midnight into the previous day.
    - cron: '37 6 * * 2'   # Tue 06:37 UTC (1:37am CDT / 0:37am CST)
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  improve:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v7
        with:
          token: ${{ secrets.GH_PAT }}
          fetch-depth: 0

      - name: Jitter
        run: sleep $((RANDOM % 900))

      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - run: pip install anthropic --quiet

      - name: Improve
        env:
          # Proposals in a repo tend to target the same hot file, so a deep
          # queue mostly produces PRs that conflict with each other.
          MAX_OPEN_PRS: "3"
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GH_TOKEN: ${{ secrets.GH_PAT }}
          GIT_AUTHOR_NAME: Scott Severance
          GIT_AUTHOR_EMAIL: scott@scottseverance.net
          GIT_COMMITTER_NAME: Scott Severance
          GIT_COMMITTER_EMAIL: scott@scottseverance.net
        run: python scripts/ai_improve.py
