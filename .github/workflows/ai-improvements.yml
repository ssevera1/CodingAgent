name: Continuous Improvement

on:
  # No `schedule:` here on purpose. GitHub's cron is best-effort: measured
  # on these repos Aug 25-31, the daily 06:17 UTC pr-janitor started between
  # 52 minutes and 12h27m late, so a 01:23 local slot was landing mid-workday.
  # The trigger now comes from Windows Task Scheduler via
  # D:\Claude\scripts\dispatch-improvements.ps1, which fires on time and
  # catches up a slot missed while the machine was off.
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  improve:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v7
        with:
          token: ${{ secrets.GH_PAT }}
          fetch-depth: 0

      - name: Jitter
        run: sleep $((RANDOM % 900))

      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - run: pip install anthropic --quiet

      - name: Improve
        env:
          # Proposals in a repo tend to target the same hot file, so a deep
          # queue mostly produces PRs that conflict with each other.
          MAX_OPEN_PRS: "3"
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GH_TOKEN: ${{ secrets.GH_PAT }}
          GIT_AUTHOR_NAME: Scott Severance
          GIT_AUTHOR_EMAIL: scott@scottseverance.net
          GIT_COMMITTER_NAME: Scott Severance
          GIT_COMMITTER_EMAIL: scott@scottseverance.net
        run: python scripts/ai_improve.py
