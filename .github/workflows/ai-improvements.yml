name: Continuous Improvement

on:
  schedule:
    # One proposal per repo per week. At 3x/week across 11 repos the
    # review loop that follows each proposal was the largest line on
    # the API bill.
    - cron: '14 10 * * 3'   # Wed 10:14am UTC (5:14am CDT)
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  improve:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v7
        with:
          token: ${{ secrets.GH_PAT }}
          fetch-depth: 0

      - name: Jitter
        run: sleep $((RANDOM % 900))

      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - run: pip install anthropic --quiet

      - name: Improve
        env:
          # Proposals in a repo tend to target the same hot file, so a deep
          # queue mostly produces PRs that conflict with each other.
          MAX_OPEN_PRS: "3"
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GH_TOKEN: ${{ secrets.GH_PAT }}
          GIT_AUTHOR_NAME: Scott Severance
          GIT_AUTHOR_EMAIL: scott@scottseverance.net
          GIT_COMMITTER_NAME: Scott Severance
          GIT_COMMITTER_EMAIL: scott@scottseverance.net
        run: python scripts/ai_improve.py
